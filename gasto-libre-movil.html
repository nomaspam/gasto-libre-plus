<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c">
  <link rel="manifest" href="gasto-libre-manifest.json">
  <link rel="icon" href="gasto-libre-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="gasto-libre-icon.svg">
  <title>Gasto Libre</title>
  <style>
    :root{--paper:#f4f0e4;--shadow:#dcd5c3;--ink:#25251f;--soft:#706b5e;--accent:#1f6f5c;--good:#2f7d4f;--warn:#b4791e;--danger:#b23a2e;--line:rgba(37,37,31,.14)}
    *{box-sizing:border-box} body{margin:0;background:var(--shadow);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)} button,input{font:inherit} button{cursor:pointer} button:focus-visible,input:focus-visible{outline:3px solid #76bfae;outline-offset:2px}
    .app{max-width:430px;min-height:100dvh;margin:auto;padding:22px 15px 35px;background:var(--shadow)} .top{display:flex;justify-content:space-between;align-items:start;margin-bottom:15px}.eyebrow,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.eyebrow{font-size:11px;color:var(--soft);letter-spacing:.06em}.title{font-weight:800;font-size:22px;margin-top:2px}.gear{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--paper);font-size:18px}.card,.form,.receipt,.settings{background:var(--paper);border-radius:17px;box-shadow:0 2px 0 var(--line)}.card{padding:22px 20px;margin-bottom:13px}.label{font-size:12px;letter-spacing:.08em;color:var(--soft);font-weight:700}.balance{font:700 42px ui-monospace,SFMono-Regular,Menlo,monospace;margin:5px 0 2px}.of{font-size:13px;color:var(--soft);margin-bottom:15px}.bar{height:10px;border-radius:99px;background:var(--shadow);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;transition:width .25s}.breakdown{padding-top:14px;margin-top:16px;border-top:1px dashed var(--line)}.row{display:flex;align-items:center;gap:7px;margin:8px 0;font-size:13px}.row .name{width:94px;color:var(--soft)}.row .mini{height:7px;flex:1;border-radius:99px;background:var(--shadow);overflow:hidden}.row .mini i{display:block;height:100%;border-radius:99px}.row .amount{width:67px;text-align:right;font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace}.add{border:0;border-radius:15px;background:var(--accent);color:white;padding:17px;width:100%;font-size:16px;font-weight:800;margin-bottom:16px}.form,.settings{padding:16px;margin-bottom:16px}.hidden{display:none!important}.input{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:13px 14px;color:var(--ink)}.input.big{font:700 25px ui-monospace,SFMono-Regular,Menlo,monospace}.fieldlabel{font-size:12px;font-weight:800;color:var(--soft);letter-spacing:.05em;margin:5px 0 7px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.chip{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:8px 11px;font-size:13px;color:var(--soft)}.chip.selected{border-color:var(--accent);background:#d9ece6;color:#155042;font-weight:700}.quick{border-radius:10px}.actions{display:flex;gap:8px;margin-top:12px}.cancel,.save{border-radius:11px;padding:13px;border:0;font-weight:800}.cancel{flex:1;background:transparent;border:1px solid var(--line);color:var(--soft)}.save{flex:2;background:var(--accent);color:white}.receipt{padding:8px 18px 14px}.empty{text-align:center;color:var(--soft);padding:18px 0;font-size:14px}.day{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--soft);border-top:1px dashed var(--line);padding:12px 0 2px;margin-top:7px}.expense{display:flex;gap:7px;align-items:center;padding:10px 0;border-bottom:1px dotted var(--line);font-size:14px}.expense .note{flex:1}.expense .money{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace}.delete{border:0;background:transparent;color:var(--soft);font-size:20px;padding:0 3px}.settingline{display:flex;gap:8px}.settingline .input{flex:1}.small{border:0;border-radius:10px;padding:0 15px;background:var(--accent);color:white;font-weight:800}.footer{text-align:center;color:var(--soft);font-size:11px;margin-top:20px}.notice{font-size:13px;color:var(--warn);margin-top:11px;font-weight:600}.section{margin-top:16px}.sectionTitle{font:800 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.03em;margin-bottom:10px}.secondary{width:100%;background:transparent;color:var(--accent);border:1.5px solid var(--accent);padding:12px;border-radius:11px;font-weight:800;margin-top:10px}.fixedLine,.monthLine{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dotted var(--line);font-size:14px}.fixedLine span:first-child,.monthLine span:first-child{flex:1}.muted{color:var(--soft);font-size:13px}.export{margin-top:16px;width:100%;border:0;border-radius:12px;background:#fff;color:var(--accent);padding:14px;font-weight:800}
  </style>
</head>
<body><main class="app">
  <header class="top"><div><div class="eyebrow" id="week"></div><div class="title">Mi sobre semanal</div></div><button class="gear" id="settingsButton" aria-label="Ajustes">⚙</button></header>
  <section class="card"><div class="label" id="balanceLabel">TE QUEDAN</div><div class="balance" id="balance"></div><div class="of" id="of"></div><div class="bar"><i id="bar"></i></div><div class="notice hidden" id="notice"></div><div class="breakdown" id="breakdown"></div></section>
  <form class="settings hidden" id="settings"><div class="fieldlabel">LÍMITE SEMANAL</div><div class="settingline"><input class="input" id="limit" type="number" min="0.01" step="0.01" inputmode="decimal"><button class="small">Guardar</button></div></form>
  <button class="add" id="openAdd">+ Añadir gasto</button>
  <form class="form hidden" id="addForm"><div class="fieldlabel">¿CUÁNTO?</div><input class="input big" id="amount" required type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0,00" autofocus><div class="fieldlabel">CATEGORÍA</div><div class="chips" id="categories"></div><div class="fieldlabel">¿EN QUÉ?</div><div class="chips" id="quick"></div><input class="input" id="note" placeholder="Mercadona, café, etc."><div class="actions"><button class="cancel" type="button" id="cancel">Cancelar</button><button class="save" type="submit">Guardar gasto</button></div></form>
  <section class="card section"><div class="sectionTitle">GASTOS FIJOS MENSUALES</div><div id="fixedList"></div><button class="secondary" id="openFixed">+ Añadir gasto fijo</button><form class="form hidden" id="fixedForm"><div class="fieldlabel">NOMBRE</div><input class="input" id="fixedName" required placeholder="Alquiler, Netflix, gimnasio..."><div class="fieldlabel">IMPORTE MENSUAL</div><input class="input" id="fixedAmount" required type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0,00"><div class="actions"><button class="cancel" type="button" id="cancelFixed">Cancelar</button><button class="save" type="submit">Guardar fijo</button></div></form></section>
  <section class="receipt" id="receipt"></section><section class="card section"><div class="sectionTitle">HISTORIAL DE MESES</div><div id="monthHistory"></div></section><button class="export" id="exportData">⇩ Descargar copia de mis gastos</button><div class="footer">Todo se guarda en este dispositivo.</div>
</main><script>
const KEY='gasto-libre-movil-v1', cats=[['comida','🍽️','Comida','#b4791e',['Mercadona','Paquitan','Esclat']],['ocio','🎉','Ocio','#6e5fa8',['Café/Bar','Helados']],['transporte','🚕','Transporte','#2b7fa3',[]],['compras','🛍️','Compras','#b23a2e',['Chinos','AliExpress','Temu']],['otros','•','Otros','#706b5e',[]]];
const emptyData={limit:35,expenses:[],fixed:[]}; let storageAvailable=true;
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return {...emptyData,expenses:[],fixed:[]};const saved=JSON.parse(raw);return {limit:Number(saved.limit)||35,expenses:Array.isArray(saved.expenses)?saved.expenses:[],fixed:Array.isArray(saved.fixed)?saved.fixed:[]}}catch(e){storageAvailable=false;return {...emptyData,expenses:[],fixed:[]}}}
let data=load(), category='comida'; const formatEUR=n=>Number(n).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
function weekKey(d=new Date()){let x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);let y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return x.getUTCFullYear()+'-S'+String(Math.ceil((((x-y)/86400000)+1)/7)).padStart(2,'0')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));storageAvailable=true}catch(e){storageAvailable=false}} function cat(id){return cats.find(x=>x[0]===id)||cats[4]}
function render(){renderFixed();renderHistory();let wk=weekKey(), list=data.expenses.filter(x=>x.week===wk),spent=list.reduce((a,x)=>a+x.amount,0),left=data.limit-spent,pct=Math.min(100,Math.max(0,spent/data.limit*100)),over=left<0;let color=over?'var(--danger)':pct>=75?'var(--warn)':'var(--good)';document.querySelector('#week').textContent='GASTO LIBRE · SEMANA '+wk.split('-S')[1];document.querySelector('#balanceLabel').textContent=over?'TE HAS PASADO EN':'TE QUEDAN';let bal=document.querySelector('#balance');bal.textContent=formatEUR(Math.abs(left));bal.style.color=color;document.querySelector('#of').textContent='de '+formatEUR(data.limit)+' esta semana';let b=document.querySelector('#bar');b.style.width=pct+'%';b.style.background=color;let note=document.querySelector('#notice');note.classList.toggle('hidden',pct<75);note.textContent=over?'Esta semana ya has superado el límite.': 'Vas ajustado: queda poco margen esta semana.';document.querySelector('#limit').value=data.limit;
let sums={};list.forEach(x=>sums[x.category]=(sums[x.category]||0)+x.amount);document.querySelector('#breakdown').innerHTML=cats.filter(c=>sums[c[0]]).map(c=>`<div class="row"><span class="name">${c[1]} ${c[2]}</span><span class="mini"><i style="width:${sums[c[0]]/spent*100}%;background:${c[3]}"></i></span><span class="amount">${formatEUR(sums[c[0]])}</span></div>`).join('');
let days={};list.sort((a,b)=>b.ts-a.ts).forEach(x=>(days[x.day]??=[]).push(x));document.querySelector('#receipt').innerHTML=Object.keys(days).sort().reverse().map(day=>`<div class="day">✂ ${day===new Date().toISOString().slice(0,10)?'HOY':day}</div>`+days[day].map(x=>{let c=cat(x.category);return `<div class="expense"><span>${c[1]}</span><span class="note">${x.note||c[2]}</span><span class="money">${formatEUR(x.amount)}</span><button class="delete" data-id="${x.id}" aria-label="Eliminar gasto">×</button></div>`}).join('')).join('')||'<div class="empty">Aún no has registrado gastos esta semana.</div>';document.querySelectorAll('.delete').forEach(b=>b.onclick=()=>{data.expenses=data.expenses.filter(x=>x.id!==b.dataset.id);save();render()})}
function renderFixed(){const total=data.fixed.reduce((sum,item)=>sum+item.amount,0),target=document.querySelector('#fixedList');target.innerHTML=(data.fixed.map(item=>`<div class="fixedLine"><span>${item.name}</span><strong>${formatEUR(item.amount)}</strong><button class="delete" data-fixed="${item.id}" aria-label="Eliminar gasto fijo">×</button></div>`).join('')||'<div class="muted">Aún no has añadido gastos fijos.</div>')+`<div class="fixedLine"><span><strong>Total fijo al mes</strong></span><strong>${formatEUR(total)}</strong></div>`;document.querySelectorAll('[data-fixed]').forEach(button=>button.onclick=()=>{data.fixed=data.fixed.filter(item=>item.id!==button.dataset.fixed);save();render()})}
function renderHistory(){const months={};data.expenses.forEach(item=>{const month=(item.day||'').slice(0,7);if(month)months[month]=(months[month]||0)+item.amount});const keys=Object.keys(months).sort().reverse();document.querySelector('#monthHistory').innerHTML=keys.length?keys.map(month=>`<div class="monthLine"><span>${new Date(month+'-02T12:00:00').toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</span><strong>${formatEUR(months[month])}</strong></div>`).join(''):'<div class="muted">El historial aparecerá aquí al registrar gastos.</div>'}
function renderPickers(){document.querySelector('#categories').innerHTML=cats.map(c=>`<button type="button" class="chip ${c[0]===category?'selected':''}" data-cat="${c[0]}">${c[1]} ${c[2]}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;renderPickers()});let c=cat(category);document.querySelector('#quick').innerHTML=c[4].map(x=>`<button type="button" class="chip quick" data-note="${x}">${x}</button>`).join('');document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>document.querySelector('#note').value=b.dataset.note)}
document.querySelector('#openAdd').onclick=()=>{document.querySelector('#openAdd').classList.add('hidden');document.querySelector('#addForm').classList.remove('hidden');renderPickers();document.querySelector('#amount').focus()};document.querySelector('#cancel').onclick=()=>{document.querySelector('#addForm').reset();document.querySelector('#addForm').classList.add('hidden');document.querySelector('#openAdd').classList.remove('hidden')};document.querySelector('#addForm').onsubmit=e=>{e.preventDefault();let a=Number(document.querySelector('#amount').value);if(!a||a<=0)return;let now=new Date();data.expenses.unshift({id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(),amount:a,note:document.querySelector('#note').value.trim(),category,week:weekKey(now),day:now.toISOString().slice(0,10),ts:Date.now()});save();document.querySelector('#cancel').click();render()};document.querySelector('#settingsButton').onclick=()=>document.querySelector('#settings').classList.toggle('hidden');document.querySelector('#settings').onsubmit=e=>{e.preventDefault();let n=Number(document.querySelector('#limit').value);if(n>0){data.limit=n;save();render();document.querySelector('#settings').classList.add('hidden')}};document.querySelector('#openFixed').onclick=()=>{document.querySelector('#openFixed').classList.add('hidden');document.querySelector('#fixedForm').classList.remove('hidden');document.querySelector('#fixedName').focus()};document.querySelector('#cancelFixed').onclick=()=>{document.querySelector('#fixedForm').reset();document.querySelector('#fixedForm').classList.add('hidden');document.querySelector('#openFixed').classList.remove('hidden')};document.querySelector('#fixedForm').onsubmit=e=>{e.preventDefault();const amount=Number(document.querySelector('#fixedAmount').value),name=document.querySelector('#fixedName').value.trim();if(!name||!amount||amount<=0)return;data.fixed.push({id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(),name,amount});save();document.querySelector('#cancelFixed').click();render()};document.querySelector('#exportData').onclick=()=>{const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),...data},null,2)],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='gasto-libre-copia-'+new Date().toISOString().slice(0,10)+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),500)};render();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./gasto-libre-sw.js').catch(()=>{}))}</script></body></html>
