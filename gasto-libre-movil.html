<!-- JAVASCRIPT APP LOGIC -->
<script>
  // Categories Definitions
  const CATEGORIES = [
    { id: 'comida', name: 'Comida', color: 'bg-amber-600', bgLight: 'bg-amber-100', text: 'text-amber-700' },
    { id: 'ocio', name: 'Ocio', color: 'bg-indigo-600', bgLight: 'bg-indigo-100', text: 'text-indigo-600' },
    { id: 'servicios', name: 'Servicios', color: 'bg-emerald-600', bgLight: 'bg-emerald-100', text: 'text-emerald-600' },
    { id: 'compras', name: 'Compras', color: 'bg-sky-600', bgLight: 'bg-sky-100', text: 'text-sky-600' },
    { id: 'suscripciones', name: 'Suscripciones', color: 'bg-stone-500', bgLight: 'bg-stone-200', text: 'text-stone-500' }
  ];

  const PRESET_TAGS = {
    comida: ['Mercadona', 'Paquitan', 'Esclat'],
    ocio: ['Café/Bar', 'Helados', 'Dulces'],
    servicios: [],
    compras: ['Supermercado', 'Ropa', 'Hogar'],
    suscripciones: ['Prime Video', 'ChatGPT', 'iCloud', 'FaceApp', 'Netflix', 'Otros']
  };

  // Application State. Si existen datos de la versión anterior, se migran una sola vez.
  function readJSON(key, fallback) {
    try {
      const value = localStorage.getItem(key);
      return value === null ? fallback : JSON.parse(value);
    } catch (error) {
      return fallback;
    }
  }

  const hasCurrentData = localStorage.getItem('envelope_weekly_limit') !== null
    || localStorage.getItem('envelope_expenses') !== null
    || localStorage.getItem('envelope_fixed_expenses') !== null;
  const legacyState = hasCurrentData ? null : readJSON('gasto-libre-movil-v1', null);
  const legacyCategoryMap = {
    comida: 'comida',
    ocio: 'ocio',
    transporte: 'servicios',
    compras: 'compras',
    otros: 'servicios'
  };

  let weeklyLimit = Number(localStorage.getItem('envelope_weekly_limit'));
  if (!Number.isFinite(weeklyLimit) || weeklyLimit <= 0) {
    weeklyLimit = Number(legacyState?.limit ?? legacyState?.weeklyBudget) || 100;
  }

  let expenses = readJSON('envelope_expenses', null);
  if (!Array.isArray(expenses)) {
    expenses = Array.isArray(legacyState?.expenses) ? legacyState.expenses.map((item, index) => ({
      id: String(item.id ?? `legacy-${index}`),
      amount: Number(item.amount) || 0,
      category: legacyCategoryMap[item.category] || 'servicios',
      name: item.name || item.note || 'Gasto',
      date: item.date || (item.day ? `${item.day}T12:00:00` : null) || item.ts || new Date().toISOString()
    })).filter(item => item.amount > 0) : [];
  }

  let fixedExpenses = readJSON('envelope_fixed_expenses', null);
  if (!Array.isArray(fixedExpenses)) {
    const legacyFixed = legacyState?.fixedExpenses ?? legacyState?.fixed;
    fixedExpenses = Array.isArray(legacyFixed) ? legacyFixed.map((item, index) => ({
      id: String(item.id ?? `legacy-fixed-${index}`),
      name: item.name || item.note || 'Gasto fijo',
      amount: Number(item.amount) || 0
    })).filter(item => item.amount > 0) : [];
  }

  let deductFixedFromWeekly = localStorage.getItem('envelope_deduct_fixed') === 'true';
  if (!hasCurrentData && legacyState) {
    localStorage.setItem('envelope_weekly_limit', weeklyLimit.toString());
    localStorage.setItem('envelope_expenses', JSON.stringify(expenses));
    localStorage.setItem('envelope_fixed_expenses', JSON.stringify(fixedExpenses));
  }

  let selectedCategory = 'comida';
  let selectedTag = '';
  let editSelectedCategory = 'comida';

  // Helpers
  function formatEUR(val) {
    return new Intl.NumberFormat('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(val) + ' €';
  }

  function escapeHTML(value) {
    const div = document.createElement('div');
    div.textContent = String(value ?? '');
    return div.innerHTML;
  }

  // Parsea un importe admitiendo tanto "1234,56" como "1.234,56" o "1234.56"
  function parseAmount(raw) {
    let s = (raw || '').trim();
    if (s.includes('.') && s.includes(',')) {
      s = s.replace(/\./g, '').replace(',', '.');
    } else if (s.includes(',')) {
      s = s.replace(',', '.');
    }
    return parseFloat(s);
  }

  // Devuelve el lunes (00:00) de la semana a la que pertenece la fecha dada
  function getWeekStart(date) {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    const day = d.getDay(); // 0=domingo ... 6=sábado
    const diff = (day === 0 ? -6 : 1) - day; // retrocede hasta el lunes
    d.setDate(d.getDate() + diff);
    return d;
  }

  // Número de semana ISO-8601
  function getISOWeekNumber(date) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const dayNum = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  }

  function isSameDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toast-message');
    toastMsg.textContent = msg;
    toast.classList.remove('opacity-0', 'pointer-events-none');
    toast.classList.add('opacity-100');
    setTimeout(() => {
      toast.classList.remove('opacity-100');
      toast.classList.add('opacity-0', 'pointer-events-none');
    }, 3000);
  }

  function saveState() {
    localStorage.setItem('envelope_weekly_limit', weeklyLimit.toString());
    localStorage.setItem('envelope_expenses', JSON.stringify(expenses));
    localStorage.setItem('envelope_fixed_expenses', JSON.stringify(fixedExpenses));
    localStorage.setItem('envelope_deduct_fixed', deductFixedFromWeekly.toString());
    render();
  }

  // Render Functions
  function render() {
    const now = new Date();
    const weekStart = getWeekStart(now);
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekEnd.getDate() + 7);

    // Cabecera: semana real
    document.getElementById('week-label').textContent = `GASTO LIBRE · SEMANA ${getISOWeekNumber(now)}`;

    // Gastos de la semana en curso (para el sobre) vs. todos (para el historial)
    const weekExpenses = expenses.filter(e => {
      const d = new Date(e.date);
      return d >= weekStart && d < weekEnd;
    });
    const todayExpenses = expenses.filter(e => isSameDay(new Date(e.date), now));

    // 1. Calculations
    const totalFixedForCalc = fixedExpenses.reduce((acc, f) => acc + f.amount, 0);
    const weeklyFixedEquiv = totalFixedForCalc / 4.345; // semanas medias por mes
    const effectiveLimit = deductFixedFromWeekly ? Math.max(weeklyLimit - weeklyFixedEquiv, 0) : weeklyLimit;

    const totalSpent = weekExpenses.reduce((acc, c) => acc + c.amount, 0);
    const remaining = effectiveLimit - totalSpent;
    const pct = effectiveLimit > 0 ? Math.min(Math.max((totalSpent / effectiveLimit) * 100, 0), 100) : 0;

    // Remaining Display
    const remEl = document.getElementById('remaining-amount');
    remEl.textContent = formatEUR(remaining);
    remEl.className = `text-4xl font-extrabold mt-1 tracking-tight ${remaining < 0 ? 'text-red-600' : 'text-[#1B5E4C]'}`;

    document.getElementById('weekly-limit-sub').textContent = deductFixedFromWeekly
      ? `de ${formatEUR(effectiveLimit)} esta semana (${formatEUR(weeklyLimit)} − ${formatEUR(weeklyFixedEquiv)} de fijos)`
      : `de ${formatEUR(effectiveLimit)} esta semana`;

    const progressBar = document.getElementById('progress-bar');
    progressBar.style.width = `${pct}%`;
    progressBar.className = `h-full transition-all duration-500 rounded-full ${remaining < 0 ? 'bg-red-500' : 'bg-[#1B5E4C]'}`;

    // 2. Breakdown (solo gastos de esta semana)
    const catBreakdown = {};
    CATEGORIES.forEach(c => catBreakdown[c.id] = 0);
    weekExpenses.forEach(e => {
      catBreakdown[e.category] = (catBreakdown[e.category] || 0) + e.amount;
    });

    const bdContainer = document.getElementById('category-breakdown-container');
    bdContainer.innerHTML = '';
    let hasExpenses = false;

    CATEGORIES.forEach(cat => {
      const spent = catBreakdown[cat.id] || 0;
      if (spent > 0) {
        hasExpenses = true;
        const catPct = effectiveLimit > 0 ? Math.min((spent / effectiveLimit) * 100, 100) : 0;
        bdContainer.innerHTML += `
          <div class="flex items-center gap-3">
            <div class="flex items-center gap-1.5 w-24 text-[#4A5450] shrink-0">
              <span class="capitalize truncate">${cat.name}</span>
            </div>
            <div class="flex-1 h-2 bg-[#E2DDD0] rounded-full overflow-hidden">
              <div class="h-full ${cat.color} rounded-full transition-all duration-300" style="width: ${catPct}%"></div>
            </div>
            <div class="w-16 text-right font-mono font-bold text-[#2C3531]">
              ${formatEUR(spent)}
            </div>
          </div>
        `;
      }
    });

    if (!hasExpenses) {
      bdContainer.innerHTML = `<div class="text-center py-2 text-xs text-[#8B938F] italic">Sin gastos registrados esta semana</div>`;
    }

    // 3. Category Buttons
    const catButtonsContainer = document.getElementById('category-buttons');
    catButtonsContainer.innerHTML = '';
    CATEGORIES.forEach(cat => {
      const isSel = selectedCategory === cat.id;
      catButtonsContainer.innerHTML += `
        <button
          type="button"
          onclick="selectCategory('${cat.id}')"
          class="flex items-center gap-1.5 px-3.5 py-2 rounded-full text-xs font-semibold border transition-all ${
            isSel 
              ? 'bg-[#1B5E4C] text-white border-[#1B5E4C] shadow-sm scale-105' 
              : 'bg-white text-[#525B56] border-[#E0DACB] hover:bg-[#F3EFE6]'
          }"
        >
          ${cat.name}
        </button>
      `;
    });

    // 4. Preset Tags
    const presetContainer = document.getElementById('preset-tags');
    presetContainer.innerHTML = '';
    const currentPresets = PRESET_TAGS[selectedCategory] || PRESET_TAGS.comida;
    currentPresets.forEach(tag => {
      const isSel = selectedTag === tag;
      presetContainer.innerHTML += `
        <button
          type="button"
          onclick="selectTag('${tag}')"
          class="px-3 py-1.5 rounded-xl text-xs font-medium border transition-colors ${
            isSel 
              ? 'bg-[#E5E0D3] text-[#1B5E4C] border-[#1B5E4C] font-bold shadow-xs' 
              : 'bg-[#FAF7F0] text-[#525B56] border-[#E0DACB] hover:bg-[#F0ECE1]'
          }"
        >
          ${tag}
        </button>
      `;
    });

    // 5. Fixed Expenses List
    const fixedList = document.getElementById('fixed-expenses-list');
    fixedList.innerHTML = '';
    let totalFixed = 0;
    fixedExpenses.forEach(item => {
      totalFixed += item.amount;
      fixedList.innerHTML += `
        <div class="flex justify-between items-center text-sm py-1 border-b border-[#EBE5D8] last:border-0">
          <span class="font-bold text-[#353F3B] uppercase tracking-wide text-xs">${escapeHTML(item.name)}</span>
          <div class="flex items-center gap-2">
            <span class="font-bold text-[#2C3531]">${formatEUR(item.amount)}</span>
            <button onclick="deleteFixedExpense('${item.id}')" class="text-[#9CA3A0] hover:text-red-500 p-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>
        </div>
      `;
    });
    if (fixedExpenses.length === 0) {
      fixedList.innerHTML = `<div class="text-xs text-[#8B938F] italic py-1">Sin gastos fijos mensuales</div>`;
    }
    document.getElementById('fixed-total').textContent = formatEUR(totalFixed);
    document.getElementById('fixed-weekly-equiv').textContent = `Equivale a ${formatEUR(totalFixed / 4.345)}/semana`;

    // 6. Recent Expenses List ("HOY") — solo los gastos de hoy
    const recentList = document.getElementById('recent-expenses-list');
    recentList.innerHTML = '';
    todayExpenses.forEach(exp => {
      const catObj = CATEGORIES.find(c => c.id === exp.category) || CATEGORIES[4];
      recentList.innerHTML += `
        <div class="flex justify-between items-center text-sm py-2 border-b border-[#EBE5D8] last:border-0">
          <div class="flex items-center gap-2.5">
            <div class="p-1.5 rounded-lg ${catObj.bgLight} ${catObj.text} text-xs font-bold">
              ${catObj.name[0]}
            </div>
            <span class="font-semibold text-[#353F3B]">${escapeHTML(exp.name)}</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="font-mono font-bold text-[#2C3531]">${formatEUR(exp.amount)}</span>
            <button onclick="openEditExpense('${exp.id}')" class="text-[#9CA3A0] hover:text-[#1B5E4C] p-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            </button>
            <button onclick="deleteExpense('${exp.id}')" class="text-[#9CA3A0] hover:text-red-500 p-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>
        </div>
      `;
    });
    if (todayExpenses.length === 0) {
      recentList.innerHTML = `<div class="text-center py-4 text-xs text-[#8B938F]">Hoy no hay transacciones registradas.</div>`;
    }

    // 6b. Category buttons for the edit modal (mismo estilo que el formulario principal)
    const editCatContainer = document.getElementById('edit-category-buttons');
    if (editCatContainer) {
      editCatContainer.innerHTML = '';
      CATEGORIES.forEach(cat => {
        const isSel = editSelectedCategory === cat.id;
        editCatContainer.innerHTML += `
          <button
            type="button"
            onclick="selectEditCategory('${cat.id}')"
            class="flex items-center gap-1.5 px-3.5 py-2 rounded-full text-xs font-semibold border transition-all ${
              isSel
                ? 'bg-[#1B5E4C] text-white border-[#1B5E4C] shadow-sm scale-105'
                : 'bg-white text-[#525B56] border-[#E0DACB] hover:bg-[#F3EFE6]'
            }"
          >
            ${cat.name}
          </button>
        `;
      });
    }

    // 7. Monthly History
    const monthlyMap = {};
    expenses.forEach(exp => {
      const d = new Date(exp.date);
      const mStr = d.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
      monthlyMap[mStr] = (monthlyMap[mStr] || 0) + exp.amount;
    });

    const monthlyList = document.getElementById('monthly-history-list');
    monthlyList.innerHTML = '';
    const monthEntries = Object.entries(monthlyMap);
    monthEntries.forEach(([month, amt]) => {
      monthlyList.innerHTML += `
        <div class="flex justify-between items-center text-sm py-1.5 border-b border-[#EBE5D8] last:border-0">
          <span class="capitalize font-semibold text-[#353F3B]">${month}</span>
          <span class="font-mono font-bold text-[#2C3531]">${formatEUR(amt)}</span>
        </div>
      `;
    });
    if (monthEntries.length === 0) {
      monthlyList.innerHTML = `<div class="text-xs text-[#8B938F] italic">Sin historial de meses</div>`;
    }
  }

  // User Actions
  function selectCategory(catId) {
    selectedCategory = catId;
    selectedTag = '';
    render();
  }

  function selectTag(tagName) {
    selectedTag = tagName;
    document.getElementById('input-note').value = tagName;
    render();
  }

  function deleteExpense(id) {
    expenses = expenses.filter(e => e.id !== id);
    saveState();
    showToast('Gasto eliminado');
  }

  function selectEditCategory(catId) {
    editSelectedCategory = catId;
    render();
  }

  function openEditExpense(id) {
    const exp = expenses.find(e => e.id === id);
    if (!exp) return;
    editSelectedCategory = exp.category;
    document.getElementById('input-edit-id').value = exp.id;
    document.getElementById('input-edit-amount').value = exp.amount.toString().replace('.', ',');
    document.getElementById('input-edit-note').value = exp.name;
    render();
    document.getElementById('modal-edit').classList.remove('hidden');
  }

  function deleteFixedExpense(id) {
    fixedExpenses = fixedExpenses.filter(f => f.id !== id);
    saveState();
    showToast('Gasto fijo eliminado');
  }

  // Event Listeners
  document.getElementById('expense-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const amtInput = document.getElementById('input-amount');
    const noteInput = document.getElementById('input-note');

    const val = parseAmount(amtInput.value);
    if (isNaN(val) || val <= 0) {
      showToast('Introduce una cantidad válida');
      return;
    }

    const title = noteInput.value.trim() || selectedTag || CATEGORIES.find(c => c.id === selectedCategory)?.name || 'Gasto';

    expenses.unshift({
      id: Date.now().toString(),
      amount: val,
      category: selectedCategory,
      name: title,
      date: new Date().toISOString()
    });

    amtInput.value = '';
    noteInput.value = '';
    selectedTag = '';
    saveState();
    showToast('Gasto añadido correctamente');
  });

  document.getElementById('btn-cancel-expense').addEventListener('click', () => {
    document.getElementById('input-amount').value = '';
    document.getElementById('input-note').value = '';
    selectedTag = '';
    render();
  });

  // Settings Modal
  const settingsModal = document.getElementById('modal-settings');
  document.getElementById('btn-open-settings').addEventListener('click', () => {
    document.getElementById('input-limit').value = weeklyLimit.toString().replace('.', ',');
    document.getElementById('input-deduct-fixed').checked = deductFixedFromWeekly;
    settingsModal.classList.remove('hidden');
  });
  document.getElementById('btn-close-settings').addEventListener('click', () => settingsModal.classList.add('hidden'));
  document.getElementById('btn-cancel-settings').addEventListener('click', () => settingsModal.classList.add('hidden'));

  document.getElementById('btn-save-settings').addEventListener('click', () => {
    const val = parseAmount(document.getElementById('input-limit').value);
    if (!isNaN(val) && val > 0) {
      weeklyLimit = val;
      deductFixedFromWeekly = document.getElementById('input-deduct-fixed').checked;
      settingsModal.classList.add('hidden');
      saveState();
      showToast('Presupuesto actualizado');
    }
  });

  // Fixed Expense Modal
  const fixedModal = document.getElementById('modal-fixed');
  document.getElementById('btn-open-fixed-modal').addEventListener('click', () => {
    document.getElementById('input-fixed-name').value = '';
    document.getElementById('input-fixed-amount').value = '';
    fixedModal.classList.remove('hidden');
  });
  document.getElementById('btn-close-fixed').addEventListener('click', () => fixedModal.classList.add('hidden'));
  document.getElementById('btn-cancel-fixed').addEventListener('click', () => fixedModal.classList.add('hidden'));

  document.getElementById('fixed-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('input-fixed-name').value.trim();
    const val = parseAmount(document.getElementById('input-fixed-amount').value);

    if (!name || isNaN(val) || val <= 0) {
      showToast('Completa los campos correctamente');
      return;
    }

    fixedExpenses.push({ id: Date.now().toString(), name, amount: val });
    fixedModal.classList.add('hidden');
    saveState();
    showToast('Gasto fijo añadido');
  });

  // Export JSON Backup
  document.getElementById('btn-export').addEventListener('click', () => {
    const data = { weeklyLimit, expenses, fixedExpenses, deductFixedFromWeekly, version: 2, exportDate: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `copia_gastos_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Copia descargada');
  });

  // Import JSON Backup
  document.getElementById('input-import-file').addEventListener('change', (e) => {
    const file = e.target.files?.[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = JSON.parse(evt.target.result);
        const confirmado = confirm('Esto reemplazará TODOS tus datos actuales (gastos, fijos y límite) por los de la copia. ¿Continuar?');
        if (!confirmado) {
          e.target.value = '';
          return;
        }
        if (Number(data.weeklyLimit) > 0) weeklyLimit = Number(data.weeklyLimit);
        if (Array.isArray(data.expenses)) expenses = data.expenses;
        if (Array.isArray(data.fixedExpenses)) fixedExpenses = data.fixedExpenses;
        if (typeof data.deductFixedFromWeekly === 'boolean') deductFixedFromWeekly = data.deductFixedFromWeekly;
        saveState();
        settingsModal.classList.add('hidden');
        showToast('Datos importados con éxito');
      } catch (err) {
        showToast('Error al leer el archivo JSON');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  // Edit Expense Modal
  const editModal = document.getElementById('modal-edit');
  document.getElementById('btn-close-edit').addEventListener('click', () => editModal.classList.add('hidden'));
  document.getElementById('btn-cancel-edit').addEventListener('click', () => editModal.classList.add('hidden'));

  document.getElementById('edit-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const id = document.getElementById('input-edit-id').value;
    const val = parseAmount(document.getElementById('input-edit-amount').value);
    const note = document.getElementById('input-edit-note').value.trim();

    if (isNaN(val) || val <= 0) {
      showToast('Introduce una cantidad válida');
      return;
    }

    const exp = expenses.find(x => x.id === id);
    if (exp) {
      exp.amount = val;
      exp.category = editSelectedCategory;
      exp.name = note || CATEGORIES.find(c => c.id === editSelectedCategory)?.name || 'Gasto';
    }

    editModal.classList.add('hidden');
    saveState();
    showToast('Gasto actualizado');
  });

  // Initial Render
  render();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./gasto-libre-sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
